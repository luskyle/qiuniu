name: Extension CI/CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Type-check, build, and package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run check-types

      - name: Compile extension
        run: npm run compile

      - name: Package VS Code extension
        run: npx --yes @vscode/vsce package --no-dependencies --out lilypond-score-editor.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: lilypond-score-editor
          path: lilypond-score-editor.vsix
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: lilypond-score-editor
          path: release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/lilypond-score-editor.vsix --verify-tag --generate-notes
